# Cloudflare Workers Static Assets (SPA) — app.sonari.shop (ADR-008)
#
# Workers Builds (monorepo) — Root directory = / (repo root).
#   Build:    pnpm install --frozen-lockfile && pnpm turbo run build --filter=@sonari/store
#   Deploy:   npx wrangler deploy -c apps/store/wrangler.toml
#   Versions: npx wrangler versions upload -c apps/store/wrangler.toml
#
# Build watch paths (include): apps/store/** packages/ui/** packages/config/** packages/types/** packages/db/**
#   package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json
# Exclude: Plans/** apps/admin/** apps/api/**

name = "sonari-store"
compatibility_date = "2025-07-04"
workers_dev = false

[[routes]]
pattern = "app.sonari.shop"
custom_domain = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
