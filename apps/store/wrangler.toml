# Cloudflare Workers Static Assets (SPA)
# Custom domain: app.sonari.shop (ADR-008)
# Zone sonari.shop must be Active on this Cloudflare account.
#
# Cloudflare Workers Builds (repo root empty):
#   Build:  pnpm install --frozen-lockfile && pnpm turbo run build --filter=@sonari/store
#   Deploy: pnpm cf:deploy:store
#   (equiv: npx wrangler versions upload -c apps/store/wrangler.toml)
#
# Build watch paths (dashboard → Settings → Build) — include:
#   apps/store/**, packages/ui/**, packages/config/**, packages/types/**, packages/db/**
#   package.json, pnpm-lock.yaml, pnpm-workspace.yaml, turbo.json
# Exclude: Plans/**, apps/admin/**, apps/api/**

name = "sonari-store"
compatibility_date = "2025-07-04"
workers_dev = false

[[routes]]
pattern = "app.sonari.shop"
custom_domain = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
