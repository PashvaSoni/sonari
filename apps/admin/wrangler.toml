# Cloudflare Workers Static Assets (SPA) — admin.sonari.shop (ADR-008)
#
# Workers Builds (monorepo) — set ALL of these in the Cloudflare dashboard:
#   Root directory:                          apps/admin
#   Build command:                           cd ../.. && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@sonari/admin
#   Deploy command:                          npx wrangler deploy
#   Non-production branch deploy command:    npx wrangler versions upload
#
# Root directory is required so bare `wrangler versions upload` finds this file + ./dist.
# Leaving root empty makes preview deploys fail with "Missing entry-point / assets directory".
#
# Build watch paths (include): apps/admin/** packages/ui/** packages/config/**
#   package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json
# Exclude: Plans/** apps/store/** apps/api/**

name = "sonari-admin"
compatibility_date = "2025-07-04"
workers_dev = false

[[routes]]
pattern = "admin.sonari.shop"
custom_domain = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
