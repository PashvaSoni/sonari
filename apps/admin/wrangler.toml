# Cloudflare Workers Static Assets (SPA) — admin.sonari.shop (ADR-008)
#
# Workers Builds (monorepo) — Root directory = / (repo root).
#   Build:    pnpm install --frozen-lockfile && pnpm turbo run build --filter=@sonari/admin
#   Deploy:   npx wrangler deploy -c apps/admin/wrangler.toml
#   Versions: npx wrangler versions upload -c apps/admin/wrangler.toml
#
# Build watch paths (include): apps/admin/** packages/ui/** packages/config/**
#   package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json
# Exclude: Plans/** apps/store/** apps/api/**

name = "sonari-admin"
compatibility_date = "2025-07-04"
workers_dev = false

[[routes]]
pattern = "admin.sonari.shop"
custom_domain = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
